<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intercambio de regalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap"></noscript>
<style>
  :root{
    --pine:#0e3a2c; --pine2:#14523e; --cream:#fff8ec; --ink:#2a1d14; --muted:#7a6a5c;
    --red:#c8202f; --red2:#a3141f; --gold:#e9b44c; --gold2:#c98f22; --line:#eadbc4; --ok:#1f8a52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  html{background:#0b2d22}
  body{
    font-family:Nunito,system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0%, var(--pine2) 0%, var(--pine) 60%, #082419 100%) fixed;
    min-height:100vh;overflow-x:hidden;
  }
  .snow{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:
      radial-gradient(2px 2px at 20px 30px,#fff,transparent),
      radial-gradient(2px 2px at 120px 80px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 200px 150px,#fff,transparent),
      radial-gradient(2px 2px at 300px 40px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 80px 200px,#fff,transparent),
      radial-gradient(2px 2px at 260px 230px,#fff,transparent);
    background-size:340px 260px;animation:fall 18s linear infinite}
  @keyframes fall{from{background-position:0 0}to{background-position:60px 520px}}
  .wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:22px 16px 60px}
  header{text-align:center;color:var(--cream);margin:6px 0 18px}
  header .tag{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
  h1{font-family:"Baloo 2",cursive;font-weight:800;font-size:34px;line-height:1.05;margin:4px 0 6px}
  header p{margin:0;opacity:.8;font-size:15px}
  .card{background:var(--cream);border-radius:20px;padding:18px 16px;margin:0 0 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .card h2{font-family:"Baloo 2",cursive;font-size:21px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .card h2 .count{margin-left:auto;font-family:Nunito;font-size:13px;font-weight:800;background:var(--pine);color:var(--cream);border-radius:99px;padding:3px 10px}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
  input{width:100%;font:inherit;font-size:16px;padding:12px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
  input:focus{border-color:var(--gold)}
  .row{display:flex;gap:8px}
  .row > *{flex:1;min-width:0}
  .add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:6px}
  .btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 16px;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red2)}
  .btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold2)}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
  .btn.wa{background:#25d366;color:#08331a;box-shadow:0 4px 0 #179c48;padding:10px 12px;font-size:14px}
  .btn.small{padding:10px 12px;font-size:14px}
  .btn.block{width:100%}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .plus{width:48px;padding:0;font-size:24px}
  ul.people{list-style:none;margin:12px 0 0;padding:0}
  ul.people li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px dashed var(--line)}
  ul.people li:first-child{border-top:0}
  .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
  .pname{font-weight:800}
  .pphone{font-size:12px;color:var(--muted)}
  .grow{flex:1;min-width:0}
  .x{border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;padding:4px 8px}
  .hint{font-size:13px;color:var(--muted);margin:8px 0 0}
  .empty{color:var(--muted);text-align:center;padding:14px 0 4px;font-size:14px}
  .linkbtn{border:0;background:none;color:var(--red);font:inherit;font-weight:800;font-size:14px;cursor:pointer;padding:6px 0}
  .sticky{position:sticky;bottom:12px;z-index:3}
  .err{color:var(--red);font-weight:700;font-size:14px;margin-top:8px;min-height:1em}

  /* tómbola */
  .tombola{text-align:center;color:var(--cream);padding:50px 0}
  .drum{font-family:"Baloo 2";font-size:40px;font-weight:800;height:60px;color:var(--gold)}
  .spin{width:90px;height:90px;margin:0 auto 18px;border-radius:50%;border:8px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  .res li{flex-wrap:wrap}
  .res .acts{display:flex;gap:6px}
  .sent{font-size:12px;font-weight:800;color:var(--ok)}
  .spoiler{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:12px;margin-top:10px}
  .pair{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:700}
  .pair .arrow{color:var(--red)}
  .confirm{background:#fff3f3;border:2px solid #f3c2c5;border-radius:14px;padding:12px;margin-top:10px;font-size:14px}
  .linkbox{width:100%;font-size:12px;margin-top:8px}

  /* participante */
  .stage{text-align:center;color:var(--cream);padding-top:10px}
  .stage h1{font-size:38px}
  .gift{position:relative;width:200px;height:200px;margin:34px auto 10px;cursor:pointer;user-select:none}
  .gift .box{position:absolute;bottom:0;left:15px;width:170px;height:130px;background:var(--red);border-radius:10px;box-shadow:inset 0 -14px 0 rgba(0,0,0,.15),0 18px 30px rgba(0,0,0,.35)}
  .gift .box:before{content:"";position:absolute;left:72px;top:0;width:26px;height:100%;background:var(--gold)}
  .gift .lid{position:absolute;top:44px;left:5px;width:190px;height:40px;background:var(--red2);border-radius:10px;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .7s;z-index:2;box-shadow:0 6px 0 rgba(0,0,0,.15)}
  .gift .lid:before{content:"";position:absolute;left:82px;top:0;width:26px;height:100%;background:var(--gold2)}
  .gift .bow{position:absolute;left:58px;top:-36px;width:74px;height:40px}
  .gift .bow:before,.gift .bow:after{content:"";position:absolute;top:4px;width:36px;height:30px;border:9px solid var(--gold);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
  .gift .bow:before{left:-4px;transform:rotate(-22deg)}
  .gift .bow:after{right:-4px;transform:rotate(22deg)}
  .gift.shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) scale(1.04)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
  .gift.open .lid{transform:translate(40px,-170px) rotate(28deg);opacity:0}
  .gift.open .box{animation:pop .5s}
  @keyframes pop{50%{transform:scaleY(.9)}}
  .dots{display:flex;gap:10px;justify-content:center;margin:12px 0}
  .dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.2);transition:.2s}
  .dots i.on{background:var(--gold);transform:scale(1.2)}
  .tap{font-weight:800;font-size:17px;opacity:.9}
  .reveal{display:none;margin-top:-30px}
  .reveal.show{display:block;animation:rise .7s cubic-bezier(.2,1.4,.4,1)}
  @keyframes rise{from{opacity:0;transform:translateY(60px) scale(.8)}}
  .reveal .card{text-align:center;padding:24px 18px}
  .reveal .lbl{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:12px}
  .reveal .who{font-family:"Baloo 2";font-weight:800;font-size:44px;line-height:1.05;color:var(--red);margin:6px 0 4px;word-break:break-word}
  .meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
  .chip{background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px}
  .secret{font-size:14px;color:var(--muted);margin:10px 0 16px}
  .wheelwrap{position:relative;width:fit-content;margin:26px auto 22px}
  .wheelwrap canvas{display:block;border-radius:50%;box-shadow:0 18px 40px rgba(0,0,0,.4)}
  .pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--cream);z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
  .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.3);border:4px solid var(--gold)}
  .reveal{margin-top:0 !important}
  .wish{margin-top:6px;padding:8px 10px;font-size:14px;border-width:1.5px}
  textarea{width:100%;font:inherit;font-size:15px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;resize:vertical;min-height:90px}
  textarea:focus{border-color:var(--gold)}
  .wishbox{margin-top:14px;padding-top:14px;border-top:2px solid var(--line)}
  .wishbox h3{font-family:"Baloo 2";font-size:18px;margin:0 0 4px}
  .ok{color:var(--ok);font-weight:800;font-size:14px;margin-top:8px}
  .giftwish{background:#fff;border:2px dashed var(--gold);border-radius:14px;padding:12px;margin:14px 0 4px;text-align:left}
  .giftwish b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);margin-bottom:4px}
  .giftwish div{white-space:pre-wrap;word-break:break-word;font-weight:700}
  .namechips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
  .namechip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
  .namechip.on{background:var(--red);border-color:var(--red);color:#fff}
  .sts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .st{font-size:11px;font-weight:800;border-radius:99px;padding:3px 8px;background:#efe6d6;color:var(--muted);border:0;font-family:inherit}
  .st.on{background:#dff3e6;color:var(--ok)}
  .st.free{background:#fde3e5;color:var(--red);cursor:pointer}
  input.fam{width:auto;flex:1;min-width:0;font-size:13px;font-weight:700;padding:5px 8px;border-width:1.5px;border-radius:10px}
  .famsum{margin-top:14px;padding:12px;border-radius:14px;background:#fff;border:2px dashed var(--line);font-size:14px}
  .famrow{padding:6px 0;border-top:1px dashed var(--line)}
  .famrow:first-child{border-top:0}
  .famsel{max-width:70%}
  .opts{display:flex;flex-wrap:wrap;gap:4px 14px}
  .opts input{width:auto;margin:0}
  .bylbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 0}
  .by{font:inherit;font-size:13px;font-weight:700;padding:5px 8px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:60%}
  .rsec{margin-top:16px;padding-top:14px;border-top:2px dashed var(--line)}
  .rsec h3{font-family:"Baloo 2";font-size:19px;margin:0 0 8px}
  .glink{display:inline-block;color:var(--red);font-weight:800;text-decoration:underline;word-break:break-all;margin:2px 0}
  .wbox{margin-top:8px}
  .giftwish.wfull{margin:0;padding:10px 12px}
  .giftwish.wfull div{font-size:15px;line-height:1.4}
  .wnone{font-size:14px;color:var(--muted);font-weight:700}
  textarea.wedit{min-height:90px;font-size:15px}
  .wrap.wide{max-width:720px}
  @media (min-width:760px){ .wrap.wide ul.people li{padding:14px 6px} }
  .namechip.taken{opacity:.55}
  input.pin{display:block;width:130px;margin:10px auto 0;text-align:center;font-size:28px;letter-spacing:.4em;font-weight:800;padding:10px}
  canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:5}
  .foot{color:rgba(255,248,236,.55);text-align:center;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="snow"></div>
<canvas id="cf"></canvas>
<div class="wrap" id="app"><div class="stage" style="padding-top:60px;text-align:center;color:#fff8ec"><h1>Cargando… 🎁</h1><p style="opacity:.85">Si no carga en unos segundos, toca los tres puntitos (⋯) y elige <b>"Abrir en Safari"</b> o <b>"Abrir en Chrome"</b>.</p></div></div>

<script>
// ================== Si algo falla, avisar en pantalla ==================
function showFail(msg){ try{ document.getElementById("app").innerHTML='<div class="stage" style="padding-top:40px"><h1>Algo falló 😕</h1><div class="card" style="color:#2a1d14">No se pudo abrir bien en este celular.<br><br>1. Toca <b>Recargar</b>.<br>2. Si sigue igual, toca los tres puntitos (⋯) y elige <b>"Abrir en Safari"</b> o <b>"Abrir en Chrome"</b>.<br><br><button class="btn red block" onclick="location.reload()">Recargar</button><p class="hint" style="margin-top:10px">Detalle: '+String(msg).replace(/[<>&]/g,"")+'</p></div></div>'; }catch(e){} }
window.addEventListener("error",function(e){ showFail(e.message||"error"); });
window.addEventListener("unhandledrejection",function(e){ showFail((e.reason&&e.reason.message)||"error de conexión"); });

// ================== Configuración ==================
const BASE_URL = (/^https?:$/.test(location.protocol) && !/claude|usercontent|sandbox/i.test(location.hostname))
  ? location.origin + location.pathname : "https://eliasbrayan67-design.github.io/intercambio/";
const DB_URL = "https://intercambio-821ea-default-rtdb.firebaseio.com".replace(/\/+$/,"");   // Firebase Realtime Database
const KEY = "andamiosmilenium-intercambio";
const STORE = "intercambio-v2";
const COLORS = ["#c8202f","#1f8a52","#c98f22","#2f6db5","#8a3fb5","#d2582a","#0f7c80","#b5306f"];

// ================== Utilidades ==================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Convierte los links escritos en el regalo en links que se pueden abrir
function linkify(t){
  return esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])|(\b(?:www\.)[^\s<]+[^\s<.,;:!?)\]'"])/gi, m=>{
    const href=(/^https?:/i.test(m)?m:"https://"+m).replace(/&amp;/g,"&");
    let label=m.replace(/^https?:\/\//i,"").replace(/^www\./i,""); const host=label.split("/")[0];
    label = label.length>32 ? host+"/…" : label;
    return `<a class="glink" href="${esc(href)}" target="_blank" rel="noopener">🔗 ${label}</a>`;
  });
}
const initials = n => n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const colorFor = n => { let h=0; for (const c of n) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
const keyOf = n => String(n).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "x";
const rand = () => Math.random().toString(36).slice(2,10);
function phoneNorm(p){ const d=(p||"").replace(/\D/g,""); if(!d) return ""; return d.length===10 ? "52"+d : d; }
function waLink(phone, text){ return "https://wa.me/"+phoneNorm(phone)+"?text="+encodeURIComponent(text); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

const A32="0123456789abcdefghijklmnopqrstuv";
function b32enc(bytes){ let bits=0,val=0,out=""; for(const b of bytes){ val=(val<<8)|b; bits+=8; while(bits>=5){ out+=A32[(val>>>(bits-5))&31]; bits-=5; } val&=(1<<bits)-1; } if(bits>0) out+=A32[(val<<(5-bits))&31]; return out; }
function b32dec(str){ let bits=0,val=0; const out=[]; for(const ch of str){ const i=A32.indexOf(ch); if(i<0) throw 0; val=(val<<5)|i; bits+=5; if(bits>=8){ out.push((val>>>(bits-8))&255); bits-=8; } val&=(1<<bits)-1; } return new Uint8Array(out); }
const kb = new TextEncoder().encode(KEY);
const xor = bytes => bytes.map((b,i)=> b ^ kb[i%kb.length] ^ ((i*7)&255));
function encode(obj){ return "x"+b32enc(xor(new TextEncoder().encode(JSON.stringify(obj)))); }
function decode(h){ try{ if(!h||!h.startsWith("x")) return null; return JSON.parse(new TextDecoder().decode(xor(b32dec(h.slice(1))))); }catch(e){ return null; } }

// ================== Base de datos ==================
const dbUrl = p => `${DB_URL}/intercambio/${p}.json`;
function tfetch(u,o){ o=o||{}; let t; const ctl=(typeof AbortController!=="undefined")?new AbortController():null; if(ctl){ o.signal=ctl.signal; t=setTimeout(()=>ctl.abort(),15000); } return fetch(u,o).finally(()=>clearTimeout(t)); }
async function dbGet(p){ const r=await tfetch(dbUrl(p),{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function dbPut(p,v){ const r=await tfetch(dbUrl(p),{method:"PUT",body:JSON.stringify(v)}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function dbDel(p){ const r=await tfetch(dbUrl(p),{method:"DELETE"}); if(!r.ok) throw new Error(r.status); }

// Quién elige por esta persona (solo si esa otra persona elige por sí misma)
function effBy(p, people){ if(!p||!p.by) return ""; const t=people.find(x=>keyOf(x.name)===keyOf(p.by)); return (t && !t.by && keyOf(t.name)!==keyOf(p.name)) ? t.name : ""; }
// PIN de 3 números: se guarda solo una huella (no el número) para poder entrar desde otro celular
function pinHash(ev,k,pin){ let h=0x811c9dc5; const str=`${ev}|${k}|${pin}|${KEY}`; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16); }
const pinOk = v => /^\d{3}$/.test(v);
// Familia de cada persona (si no tiene, usa la de quien elige por ella)
function famOf(p, people){ const f=(p&&p.fam||"").trim(); if(f) return keyOf(f); const b=effBy(p,people); if(b){ const t=people.find(x=>x.name===b); if(t&&(t.fam||"").trim()) return keyOf(t.fam); } return ""; }
function famList(){ return (S.families||[]).map(f=>({label:f,key:keyOf(f),names:S.people.filter(p=>famOf(p,S.people)===keyOf(f)).map(p=>p.name)})); }
let DEV = lsGet("devid"); if(!DEV){ DEV=rand()+rand(); lsSet("devid",DEV); }

// ================== Organizador ==================
let S = JSON.parse(lsGet(STORE)||lsGet("intercambio-v1")||"null") || {};
S = Object.assign({ev:null,title:"Intercambio Navideño 2026",org:"",orgPhone:"",budget:"",date:"",people:[],spoil:false,families:[]}, S);
S.people = (S.people||[]).map(p=>({name:p.name, phone:p.phone||"", by:p.by||"", nopin:!!p.nopin, nolock:!!p.nolock, fam:p.fam||""}));
S.families=(S.families||[]).filter(Boolean);
S.people.forEach(p=>{ const f=(p.fam||"").trim(); if(f && !S.families.some(x=>keyOf(x)===keyOf(f))) S.families.push(f); });
if(!S.ev) S.ev=rand();
function save(){ lsSet(STORE, JSON.stringify({ev:S.ev,title:S.title,org:S.org,orgPhone:S.orgPhone,budget:S.budget,date:S.date,people:S.people,spoil:S.spoil,families:S.families})); }
save();
let LIVE={claims:{},wishes:{},spun:{},draw:null}, NET=true;
const groupLink = () => BASE_URL + "#" + encode([4,S.ev]);
const adminLink = () => BASE_URL + "#" + encode([5,S.ev]);
const cfg = () => ({families:S.families.slice(), title:S.title.trim()||"Intercambio", org:S.org.trim()||"El organizador", orgPhone:phoneNorm(S.orgPhone), budget:S.budget.trim(), date:S.date.trim(), people:S.people.map(p=>({name:p.name,phone:p.phone||"",by:effBy(p,S.people),nopin:!!p.nopin,nolock:!!p.nolock,fam:(p.fam||"").trim()}))});
let cfgT; function pushCfg(now){ save(); clearTimeout(cfgT); const go=()=>dbPut(`${S.ev}/config`,cfg()).catch(()=>{}); if(now) return go(); cfgT=setTimeout(go,600); }
async function pull(){ const d=await dbGet(S.ev)||{}; LIVE={claims:d.claims||{},wishes:d.wishes||{},spun:d.spun||{},draw:d.draw||null}; return d; }
const wishOf = n => ((LIVE.wishes[keyOf(n)]||{}).wish||"").trim();
function drawList(){ if(!LIVE.draw) return []; return Object.values(LIVE.draw).map(decode).filter(Boolean).map(([g,r])=>({g,r})); }
// Regalo en la pantalla del organizador: se ve completo, con links clicables, y se edita con un botón
let EDITW={};
function paintWish(i){
  const box=$("#wb-"+i), p=S.people[i]; if(!box||!p) return;
  const w=wishOf(p.name);
  if(EDITW[i]){
    box.innerHTML=`<textarea class="wedit" id="wt-${i}" maxlength="800" placeholder="¿Qué regalo quiere ${esc(p.name.split(" ")[0])}? Puedes pegar un link">${esc(w)}</textarea>
      <div class="row" style="margin-top:6px"><button class="btn ghost small" data-wcancel="${i}">Cancelar</button><button class="btn red small" data-wok="${i}">Guardar</button></div><div class="err" id="we-${i}"></div>`;
    const ta=$("#wt-"+i); ta.focus(); ta.style.height=Math.max(90,ta.scrollHeight+4)+"px";
    ta.addEventListener("input",()=>{ ta.style.height="auto"; ta.style.height=Math.max(90,ta.scrollHeight+4)+"px"; });
    $(`[data-wcancel="${i}"]`).onclick=()=>{ EDITW[i]=false; paintWish(i); };
    $(`[data-wok="${i}"]`).onclick=async e=>{
      const v=ta.value.trim(), k=keyOf(p.name), b=e.currentTarget; b.disabled=true; b.textContent="Guardando…";
      try{ if(v) await dbPut(`${S.ev}/wishes/${k}`,{name:p.name,wish:v.slice(0,800),t:Date.now()}); else await dbDel(`${S.ev}/wishes/${k}`);
        if(v) LIVE.wishes[k]={name:p.name,wish:v.slice(0,800)}; else delete LIVE.wishes[k];
        EDITW[i]=false; paintStatus(); paintWish(i); }
      catch(err){ $("#we-"+i).textContent="No se pudo guardar. Revisa tu internet."; b.disabled=false; b.textContent="Guardar"; }
    };
  } else {
    box.innerHTML = w
      ? `<div class="giftwish wfull"><b>🎁 Quiere</b><div>${linkify(w)}</div></div><button class="linkbtn" data-wedit-o="${i}">✏️ Cambiar regalo</button>`
      : `<div class="wnone">🎁 Sin regalo todavía</div><button class="linkbtn" data-wedit-o="${i}">✏️ Escribir su regalo</button>`;
    $(`[data-wedit-o="${i}"]`).onclick=()=>{ EDITW[i]=true; paintWish(i); };
  }
}
let wishT={}; function pushWish(name,val){ clearTimeout(wishT[name]); wishT[name]=setTimeout(()=>{ const k=keyOf(name); const w=val.trim(); (w?dbPut(`${S.ev}/wishes/${k}`,{name,wish:w.slice(0,800),t:Date.now()}):dbDel(`${S.ev}/wishes/${k}`)).catch(()=>{}); LIVE.wishes[k]=w?{name,wish:w}:undefined; },700); }

function doDraw(names, people){
  people=people||[];
  const resp={}, fam={};
  people.forEach(p=>{ const b=effBy(p,people); if(b) resp[p.name]=b; fam[p.name]=famOf(p,people); });
  const bad=(g,r)=> g===r || resp[g]===r || (fam[g] && fam[g]===fam[r]);   // a nadie le toca: sí mismo, quien elige por él, ni alguien de su familia
  // Revisión rápida: si una familia tiene más de la mitad, es imposible
  const cnt={}; names.forEach(n=>{ const f=fam[n]; if(f) cnt[f]=(cnt[f]||0)+1; });
  if(Object.values(cnt).some(c=>c>names.length/2)) return null;
  const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  // 1) Preferido: una sola cadena (A→B→C→…→A)
  for(let t=0;t<30000;t++){
    const a=shuffle([...names]); const d=a.map((g,i)=>({g, r:a[(i+1)%a.length]}));
    if(d.every(x=>!bad(x.g,x.r))) return d;
  }
  // 2) Si no se puede en una cadena: cualquier reparto válido (todos dan uno y reciben uno)
  for(let t=0;t<50;t++){
    const gs=shuffle([...names]), used=new Set(), out=[]; let steps=0;
    const go=i=>{ if(i===gs.length) return true; if(++steps>20000) return false; const g=gs[i];
      for(const r of shuffle(names.filter(r=>!used.has(r)&&!bad(g,r)))){ used.add(r); out.push({g,r}); if(go(i+1)) return true; out.pop(); used.delete(r); }
      return false; };
    if(go(0)) return out;
  }
  return null;   // imposible con estas reglas
}

  $("#f-org").addEventListener("input",paintAddMe); paintAddMe();
  // participantes
  const add=()=>{
    const name=$("#p-name").value.trim().replace(/\s+/g," "), phone=$("#p-phone").value.trim();
    if(!name){ $("#p-err").textContent="Escribe un nombre."; return; }
    if(S.people.some(p=>keyOf(p.name)===keyOf(name))){ $("#p-err").textContent="Ese nombre ya está. Ponle apellido o apodo."; return; }
    S.people.push({name,phone}); pushCfg(true); renderOrg(); $("#p-name").focus();
  };
  $("#p-add").onclick=add;
  $("#p-name").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#p-phone").focus(); }});
  $("#p-phone").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); }});
  $$("[data-del]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.del, p=S.people[i], box=$("#st-"+i); if(!p||!box) return;

    $("#del-yes").onclick=()=>{ FREEING=null; S.people.splice(i,1); pushCfg(true); renderOrg(); };

  $("#fam-add").onclick=addFam; $("#fam-name").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addFam(); }});

  $$("[data-lockon]").forEach(cb=>cb.addEventListener("change",()=>{ S.people[+cb.dataset.lockon].nolock=!cb.checked; pushCfg(true); paintStatus(); }));
  $$("[data-by]").forEach(sel=>sel.addEventListener("change",()=>{ const p=S.people[+sel.dataset.by];

    if(p.by) S.people.forEach(x=>{ if(keyOf(x.by||"")===keyOf(p.name)) x.by=""; });   // quien depende de otro no puede tener dependientes

    LIVE={claims:{},wishes:{},spun:{},draw:null}; S.spoil=false; save(); renderOrg(); }; };
  paintStatus();
}
function famSummary(){
  const fl=famList(); if(!fl.length) return `<div class="empty">Todavía no hay familias.</div>`;
  const n=S.people.length; const big=fl.filter(f=>f.names.length>n/2);
  return `<div class="famsum">${fl.map((f,i)=>`<div class="famrow"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">${esc(f.label)} (${f.names.length})</b><button class="x" data-famdel="${i}" aria-label="Borrar familia">✕</button></div><div class="pphone">${f.names.length?f.names.map(esc).join(", "):"Sin integrantes todavía"}</div></div>`).join("")}
    ${big.length?`<div class="err">⚠️ La familia ${esc(big[0].label)} tiene más de la mitad de los participantes: así no se pueden armar las parejas.</div>`:""}</div>`;
}
function refreshLinks(){
  const a=$("#gl-wa"); if(a) a.href=waLink("", `🎁 ¡Hola! Ya está el ${S.title}. Entra aquí, elige quién eres y escribe qué regalo quieres${S.budget.trim()?` (presupuesto: ${S.budget.trim()})`:""}. Cuando se activen las ruletas, en este mismo link giras la tuya para ver a quién le regalas 🎰\n${groupLink()}`);
}
function paintStatus(){
  const net=$("#net"); if(net) net.textContent = NET ? "" : "⚠️ Sin conexión a la base de datos. Revisa tu internet.";
  let cl=0,wi=0,sp=0,selfN=0;
  S.people.forEach((p,i)=>{
    const k=keyOf(p.name), by=effBy(p,S.people), c=!!LIVE.claims[k], w=!!wishOf(p.name), s=!!LIVE.spun[k]; if(!by){ cl+=c; selfN++; } wi+=w; sp+=s;
    const el=$("#st-"+i); if(el && FREEING!==k) el.innerHTML = `${by?`<span class="st on">📱 Lo maneja ${esc(by)}</span>`:c?`<span class="st on">${p.nolock?"✅":"🔒"} Ya entró</span>${p.nopin?"":LIVE.claims[k]&&LIVE.claims[k].pin?`<span class="st on">🔑 PIN: ${esc(LIVE.claims[k].pv||"—")}</span>`:`<span class="st">🔑 Aún sin PIN</span>`}`:`<span class="st">⏳ No ha entrado</span>`}${w?`<span class="st on">🎁 Regalo</span>`:""}${s?`<span class="st on">🎰 Ya giró</span>`:""}${c?`<button class="st free" data-free="${k}">Liberar</button>`:""}`;
    if(!EDITW[i]) paintWish(i);
  });
  const ct=$("#counts"); if(ct && S.people.length) ct.textContent=`${cl} de ${selfN} ya entraron · ${wi} de ${S.people.length} regalos puestos`;
  const sc=$("#spuncount"); if(sc) sc.textContent=`✅ Ruletas activadas · ${sp} de ${drawList().length} ya giraron`;
}
async function refreshOrg(){ try{ await pull(); NET=true; }catch(e){ NET=false; } paintStatus(); }

async function startDraw(){
  const names=S.people.map(p=>p.name);
  $("#app").innerHTML=`<div class="tombola"><div class="spin"></div><div class="drum" id="drum"></div><p>Revolviendo papelitos…</p></div>`;
  const iv=setInterval(()=>{ $("#drum").textContent=names[Math.floor(Math.random()*names.length)]; },90);
  const d=doDraw(names,S.people), map={};
  if(!d){ clearInterval(iv); renderOrg(); $("#confirm-box").innerHTML=`<div class="confirm"><b>No se pueden armar las parejas.</b><br>Alguna familia tiene demasiados integrantes para que a nadie le toque alguien de su familia. Revisa las familias en Participantes.</div>`; $("#confirm-box").scrollIntoView({block:"center"}); return; } d.forEach(x=>map[keyOf(x.g)]=encode([x.g,x.r]));
  let ok=true;
  await Promise.all([ pushCfg(true), dbPut(`${S.ev}/draw`,map), dbDel(`${S.ev}/spun`), new Promise(r=>setTimeout(r,1900)) ]).catch(()=>{ ok=false; });
  clearInterval(iv);

}

        return `<button class="namechip ${t?"taken":""}" data-n="${i}">${t?"🔒 ":""}${esc(p.name)}${deps.length?`<small style="display:block;font-weight:700;font-size:11px;opacity:.75">+ ${deps.map(esc).join(", ")}</small>`:""}</button>`; }).join("")}</div>

function mountWheel(cv, btn, names, r, onDone){
  for(let i=names.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [names[i],names[j]]=[names[j],names[i]]; }
  const target=names.indexOf(r);
  const ctx=cv.getContext("2d"), dpr=Math.max(1,devicePixelRatio||1);
  const size=Math.min(300, innerWidth-72); cv.style.width=cv.style.height=size+"px"; cv.width=cv.height=size*dpr;
  const n=names.length, seg=2*Math.PI/n, R=size*dpr/2;
  const segCols=["#c8202f","#1f8a52","#e9b44c","#fff8ec","#2f6db5","#a3141f","#14523e","#c98f22"];
  function draw(rot){
    ctx.clearRect(0,0,cv.width,cv.height); ctx.save(); ctx.translate(R,R);
    for(let i=0;i<n;i++){
      const a0=rot+i*seg, col=segCols[(i+(n%segCols.length===1&&i===n-1?1:0))%segCols.length];
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-4*dpr,a0,a0+seg); ctx.closePath();
      ctx.fillStyle=col; ctx.fill(); ctx.strokeStyle="rgba(0,0,0,.18)"; ctx.lineWidth=2*dpr; ctx.stroke();
      ctx.save(); ctx.rotate(a0+seg/2); ctx.textAlign="right"; ctx.textBaseline="middle";
      ctx.fillStyle=(col==="#fff8ec"||col==="#e9b44c")?"#2a1d14":"#fff";
      const fs=Math.max(10, Math.min(18, 240/n))*dpr; ctx.font=`800 ${fs}px Nunito, sans-serif`;
      let t=names[i]; if(t.length>13) t=t.slice(0,12)+"…";
      ctx.fillText(t, R-14*dpr, 0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,R-3*dpr,0,2*Math.PI); ctx.lineWidth=6*dpr; ctx.strokeStyle="#e9b44c"; ctx.stroke();
    ctx.restore();
  }
  const jitter=(Math.random()-.5)*seg*.6, finalRot=-Math.PI/2-(target+.5)*seg+jitter;
  const norm=x=>((x%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  draw(Math.random()*2*Math.PI);
  btn.onclick=()=>{
    btn.disabled=true; btn.textContent="Girando…";
    const start=performance.now(), dur=5200, from=Math.random()*2*Math.PI, to=from+2*Math.PI*7+norm(finalRot-from);
    let last=-1;
    (function frame(now){
      const t=Math.min(1,(now-start)/dur), e=1-Math.pow(1-t,4), rot=from+(to-from)*e; draw(rot);
      const cur=Math.floor(norm(-Math.PI/2-rot)/seg); if(cur!==last){ last=cur; if(navigator.vibrate) try{navigator.vibrate(8)}catch(_){} }
      if(t<1) requestAnimationFrame(frame); else setTimeout(onDone,450);
    })(start);
  };
}

// ================== Confeti ==================
function confetti(){
  const c=$("#cf"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#c8202f","#e9b44c","#1f8a52","#fff8ec","#2f6db5"];
  const P=Array.from({length:160},()=>({x:c.width/2+(Math.random()-.5)*80,y:c.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0; (function step(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); x.restore(); }); if(++f<170) requestAnimationFrame(step); else x.clearRect(0,0,c.width,c.height); })();
}

    yes.disabled=true; yes.textContent="Liberando…";
    dbDel(`${S.ev}/claims/${k}`).then(()=>{ delete LIVE.claims[k]; FREEING=null; paintStatus(); })
      .catch(()=>{ yes.disabled=false; yes.textContent="Error, intenta de nuevo"; });
  }
});

// ================== Router ==================
function route(){
  const h=location.hash.replace(/^#/,"");
  if(!h) return startOrg();
  const d=decode(h);
  if(d && d[0]===4) return renderJoin(d[1]);
  if(d && d[0]===5) return openAdmin(d[1]);
  renderBad();
}
addEventListener("hashchange",route);
route();
</script>
