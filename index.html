<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intercambio de regalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#0e3a2c; --pine2:#14523e; --cream:#fff8ec; --ink:#2a1d14; --muted:#7a6a5c;
    --red:#c8202f; --red2:#a3141f; --gold:#e9b44c; --gold2:#c98f22; --line:#eadbc4; --ok:#1f8a52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  html{background:#0b2d22}
  body{
    font-family:Nunito,system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0%, var(--pine2) 0%, var(--pine) 60%, #082419 100%) fixed;
    min-height:100vh;overflow-x:hidden;
  }
  .snow{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:
      radial-gradient(2px 2px at 20px 30px,#fff,transparent),
      radial-gradient(2px 2px at 120px 80px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 200px 150px,#fff,transparent),
      radial-gradient(2px 2px at 300px 40px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 80px 200px,#fff,transparent),
      radial-gradient(2px 2px at 260px 230px,#fff,transparent);
    background-size:340px 260px;animation:fall 18s linear infinite}
  @keyframes fall{from{background-position:0 0}to{background-position:60px 520px}}
  .wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:22px 16px 60px}
  header{text-align:center;color:var(--cream);margin:6px 0 18px}
  header .tag{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
  h1{font-family:"Baloo 2",cursive;font-weight:800;font-size:34px;line-height:1.05;margin:4px 0 6px}
  header p{margin:0;opacity:.8;font-size:15px}
  .card{background:var(--cream);border-radius:20px;padding:18px 16px;margin:0 0 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .card h2{font-family:"Baloo 2",cursive;font-size:21px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .card h2 .count{margin-left:auto;font-family:Nunito;font-size:13px;font-weight:800;background:var(--pine);color:var(--cream);border-radius:99px;padding:3px 10px}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
  input{width:100%;font:inherit;font-size:16px;padding:12px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
  input:focus{border-color:var(--gold)}
  .row{display:flex;gap:8px}
  .row > *{flex:1;min-width:0}
  .add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:6px}
  .btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 16px;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red2)}
  .btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold2)}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
  .btn.wa{background:#25d366;color:#08331a;box-shadow:0 4px 0 #179c48;padding:10px 12px;font-size:14px}
  .btn.small{padding:10px 12px;font-size:14px}
  .btn.block{width:100%}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .plus{width:48px;padding:0;font-size:24px}
  ul.people{list-style:none;margin:12px 0 0;padding:0}
  ul.people li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px dashed var(--line)}
  ul.people li:first-child{border-top:0}
  .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
  .pname{font-weight:800}
  .pphone{font-size:12px;color:var(--muted)}
  .grow{flex:1;min-width:0}
  .x{border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;padding:4px 8px}
  .hint{font-size:13px;color:var(--muted);margin:8px 0 0}
  .empty{color:var(--muted);text-align:center;padding:14px 0 4px;font-size:14px}
  .linkbtn{border:0;background:none;color:var(--red);font:inherit;font-weight:800;font-size:14px;cursor:pointer;padding:6px 0}
  .sticky{position:sticky;bottom:12px;z-index:3}
  .err{color:var(--red);font-weight:700;font-size:14px;margin-top:8px;min-height:1em}

  /* tómbola */
  .tombola{text-align:center;color:var(--cream);padding:50px 0}
  .drum{font-family:"Baloo 2";font-size:40px;font-weight:800;height:60px;color:var(--gold)}
  .spin{width:90px;height:90px;margin:0 auto 18px;border-radius:50%;border:8px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  .res li{flex-wrap:wrap}
  .res .acts{display:flex;gap:6px}
  .sent{font-size:12px;font-weight:800;color:var(--ok)}
  .spoiler{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:12px;margin-top:10px}
  .pair{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:700}
  .pair .arrow{color:var(--red)}
  .confirm{background:#fff3f3;border:2px solid #f3c2c5;border-radius:14px;padding:12px;margin-top:10px;font-size:14px}
  .linkbox{width:100%;font-size:12px;margin-top:8px}

  /* participante */
  .stage{text-align:center;color:var(--cream);padding-top:10px}
  .stage h1{font-size:38px}
  .gift{position:relative;width:200px;height:200px;margin:34px auto 10px;cursor:pointer;user-select:none}
  .gift .box{position:absolute;bottom:0;left:15px;width:170px;height:130px;background:var(--red);border-radius:10px;box-shadow:inset 0 -14px 0 rgba(0,0,0,.15),0 18px 30px rgba(0,0,0,.35)}
  .gift .box:before{content:"";position:absolute;left:72px;top:0;width:26px;height:100%;background:var(--gold)}
  .gift .lid{position:absolute;top:44px;left:5px;width:190px;height:40px;background:var(--red2);border-radius:10px;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .7s;z-index:2;box-shadow:0 6px 0 rgba(0,0,0,.15)}
  .gift .lid:before{content:"";position:absolute;left:82px;top:0;width:26px;height:100%;background:var(--gold2)}
  .gift .bow{position:absolute;left:58px;top:-36px;width:74px;height:40px}
  .gift .bow:before,.gift .bow:after{content:"";position:absolute;top:4px;width:36px;height:30px;border:9px solid var(--gold);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
  .gift .bow:before{left:-4px;transform:rotate(-22deg)}
  .gift .bow:after{right:-4px;transform:rotate(22deg)}
  .gift.shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) scale(1.04)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
  .gift.open .lid{transform:translate(40px,-170px) rotate(28deg);opacity:0}
  .gift.open .box{animation:pop .5s}
  @keyframes pop{50%{transform:scaleY(.9)}}
  .dots{display:flex;gap:10px;justify-content:center;margin:12px 0}
  .dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.2);transition:.2s}
  .dots i.on{background:var(--gold);transform:scale(1.2)}
  .tap{font-weight:800;font-size:17px;opacity:.9}
  .reveal{display:none;margin-top:-30px}
  .reveal.show{display:block;animation:rise .7s cubic-bezier(.2,1.4,.4,1)}
  @keyframes rise{from{opacity:0;transform:translateY(60px) scale(.8)}}
  .reveal .card{text-align:center;padding:24px 18px}
  .reveal .lbl{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:12px}
  .reveal .who{font-family:"Baloo 2";font-weight:800;font-size:44px;line-height:1.05;color:var(--red);margin:6px 0 4px;word-break:break-word}
  .meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
  .chip{background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px}
  .secret{font-size:14px;color:var(--muted);margin:10px 0 16px}
  .wheelwrap{position:relative;width:fit-content;margin:26px auto 22px}
  .wheelwrap canvas{display:block;border-radius:50%;box-shadow:0 18px 40px rgba(0,0,0,.4)}
  .pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--cream);z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
  .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.3);border:4px solid var(--gold)}
  .reveal{margin-top:0 !important}
  .wish{margin-top:6px;padding:8px 10px;font-size:14px;border-width:1.5px}
  textarea{width:100%;font:inherit;font-size:15px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;resize:vertical;min-height:90px}
  textarea:focus{border-color:var(--gold)}
  .wishbox{margin-top:14px;padding-top:14px;border-top:2px solid var(--line)}
  .wishbox h3{font-family:"Baloo 2";font-size:18px;margin:0 0 4px}
  .ok{color:var(--ok);font-weight:800;font-size:14px;margin-top:8px}
  .giftwish{background:#fff;border:2px dashed var(--gold);border-radius:14px;padding:12px;margin:14px 0 4px;text-align:left}
  .giftwish b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);margin-bottom:4px}
  .giftwish div{white-space:pre-wrap;word-break:break-word;font-weight:700}
  .namechips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
  .namechip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
  .namechip.on{background:var(--red);border-color:var(--red);color:#fff}
  .sts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .st{font-size:11px;font-weight:800;border-radius:99px;padding:3px 8px;background:#efe6d6;color:var(--muted);border:0;font-family:inherit}
  .st.on{background:#dff3e6;color:var(--ok)}
  .st.free{background:#fde3e5;color:var(--red);cursor:pointer}
  .namechip.taken{opacity:.45;cursor:not-allowed}
  canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:5}
  .foot{color:rgba(255,248,236,.55);text-align:center;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="snow"></div>
<canvas id="cf"></canvas>
<div class="wrap" id="app"></div>

<script>
// ================== Configuración ==================
const BASE_URL = (/^https?:$/.test(location.protocol) && !/claude|usercontent|sandbox/i.test(location.hostname))
  ? location.origin + location.pathname : "https://eliasbrayan67-design.github.io/intercambio/";
const DB_URL = "https://intercambio-821ea-default-rtdb.firebaseio.com".replace(/\/+$/,"");   // Firebase Realtime Database
const KEY = "andamiosmilenium-intercambio";
const STORE = "intercambio-v2";
const COLORS = ["#c8202f","#1f8a52","#c98f22","#2f6db5","#8a3fb5","#d2582a","#0f7c80","#b5306f"];

// ================== Utilidades ==================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = n => n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const colorFor = n => { let h=0; for (const c of n) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
const keyOf = n => String(n).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "x";
const rand = () => Math.random().toString(36).slice(2,10);
function phoneNorm(p){ const d=(p||"").replace(/\D/g,""); if(!d) return ""; return d.length===10 ? "52"+d : d; }
function waLink(phone, text){ return "https://wa.me/"+phoneNorm(phone)+"?text="+encodeURIComponent(text); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

const A32="0123456789abcdefghijklmnopqrstuv";
function b32enc(bytes){ let bits=0,val=0,out=""; for(const b of bytes){ val=(val<<8)|b; bits+=8; while(bits>=5){ out+=A32[(val>>>(bits-5))&31]; bits-=5; } val&=(1<<bits)-1; } if(bits>0) out+=A32[(val<<(5-bits))&31]; return out; }
function b32dec(str){ let bits=0,val=0; const out=[]; for(const ch of str){ const i=A32.indexOf(ch); if(i<0) throw 0; val=(val<<5)|i; bits+=5; if(bits>=8){ out.push((val>>>(bits-8))&255); bits-=8; } val&=(1<<bits)-1; } return new Uint8Array(out); }
const kb = new TextEncoder().encode(KEY);
const xor = bytes => bytes.map((b,i)=> b ^ kb[i%kb.length] ^ ((i*7)&255));
function encode(obj){ return "x"+b32enc(xor(new TextEncoder().encode(JSON.stringify(obj)))); }
function decode(h){ try{ if(!h||!h.startsWith("x")) return null; return JSON.parse(new TextDecoder().decode(xor(b32dec(h.slice(1))))); }catch(e){ return null; } }

// ================== Base de datos ==================
const dbUrl = p => `${DB_URL}/intercambio/${p}.json`;
async function dbGet(p){ const r=await fetch(dbUrl(p),{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function dbPut(p,v){ const r=await fetch(dbUrl(p),{method:"PUT",body:JSON.stringify(v)}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function dbDel(p){ const r=await fetch(dbUrl(p),{method:"DELETE"}); if(!r.ok) throw new Error(r.status); }

let DEV = lsGet("devid"); if(!DEV){ DEV=rand()+rand(); lsSet("devid",DEV); }

// ================== Organizador ==================
let S = JSON.parse(lsGet(STORE)||lsGet("intercambio-v1")||"null") || {};
S = Object.assign({ev:null,title:"Intercambio Navideño 2026",org:"",orgPhone:"",budget:"",date:"",people:[],spoil:false}, S);
S.people = (S.people||[]).map(p=>({name:p.name, phone:p.phone||""}));
if(!S.ev) S.ev=rand();
function save(){ lsSet(STORE, JSON.stringify({ev:S.ev,title:S.title,org:S.org,orgPhone:S.orgPhone,budget:S.budget,date:S.date,people:S.people,spoil:S.spoil})); }
save();
let LIVE={claims:{},wishes:{},spun:{},draw:null}, NET=true;
const groupLink = () => BASE_URL + "#" + encode([4,S.ev]);
const adminLink = () => BASE_URL + "#" + encode([5,S.ev]);
const cfg = () => ({title:S.title.trim()||"Intercambio", org:S.org.trim()||"El organizador", orgPhone:phoneNorm(S.orgPhone), budget:S.budget.trim(), date:S.date.trim(), people:S.people.map(p=>({name:p.name,phone:p.phone||""}))});
let cfgT; function pushCfg(now){ save(); clearTimeout(cfgT); const go=()=>dbPut(`${S.ev}/config`,cfg()).catch(()=>{}); if(now) return go(); cfgT=setTimeout(go,600); }
async function pull(){ const d=await dbGet(S.ev)||{}; LIVE={claims:d.claims||{},wishes:d.wishes||{},spun:d.spun||{},draw:d.draw||null}; return d; }
const wishOf = n => ((LIVE.wishes[keyOf(n)]||{}).wish||"").trim();
function drawList(){ if(!LIVE.draw) return []; return Object.values(LIVE.draw).map(decode).filter(Boolean).map(([g,r])=>({g,r})); }
let wishT={}; function pushWish(name,val){ clearTimeout(wishT[name]); wishT[name]=setTimeout(()=>{ const k=keyOf(name); const w=val.trim(); (w?dbPut(`${S.ev}/wishes/${k}`,{name,wish:w.slice(0,300),t:Date.now()}):dbDel(`${S.ev}/wishes/${k}`)).catch(()=>{}); LIVE.wishes[k]=w?{name,wish:w}:undefined; },700); }

function doDraw(names){
  const a=[...names];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.map((g,i)=>({g, r:a[(i+1)%a.length]}));   // un solo ciclo: nadie se repite ni se toca a sí mismo
}

function renderOrg(){
  const n=S.people.length, drawn=!!LIVE.draw, dl=drawList();
  const drawNames=new Set(dl.map(x=>x.g)); const changed = drawn && (dl.length!==n || S.people.some(p=>!drawNames.has(p.name)));
  $("#app").innerHTML = `
    <header><span class="tag">🎄 Modo organizador</span><h1>${esc(S.title||"Intercambio de regalos")}</h1><p>Solo tú ves esta pantalla.</p></header>
    <div class="err" id="net" style="color:#ffd2d2;text-align:center"></div>
    <div class="card">
      <h2>📝 Datos</h2>
      <label>Nombre del intercambio</label><input id="f-title" value="${esc(S.title)}" placeholder="Intercambio Navideño 2026">
      <div class="row">
        <div><label>Tu nombre</label><input id="f-org" value="${esc(S.org)}" placeholder="Brayan"></div>
        <div><label>Tu WhatsApp</label><input id="f-orgPhone" inputmode="tel" value="${esc(S.orgPhone)}" placeholder="844 123 4567"></div>
      </div>
      <div class="row">
        <div><label>Presupuesto</label><input id="f-budget" value="${esc(S.budget)}" placeholder="$1,000"></div>
        <div><label>Fecha</label><input id="f-date" value="${esc(S.date)}" placeholder="24 de diciembre"></div>
      </div>
    </div>

    <div class="card">
      <h2>👥 Participantes <span class="count">${n}</span></h2>
      <div class="add">
        <input id="p-name" placeholder="Nombre" autocomplete="off">
        <input id="p-phone" inputmode="tel" placeholder="WhatsApp (opcional)">
        <button class="btn red plus" id="p-add" aria-label="Agregar">+</button>
      </div>
      <div class="err" id="p-err"></div>
      <div id="addme-wrap"></div>
      ${n? `<ul class="people">${S.people.map((p,i)=>`
        <li><span class="av" style="background:${colorFor(p.name)}">${esc(initials(p.name))}</span>
        <div class="grow"><div class="pname">${esc(p.name)}</div>
          <div class="sts" id="st-${i}"></div>
          <input class="wish" data-wish="${i}" value="${esc(wishOf(p.name))}" placeholder="🎁 Regalo que quiere" maxlength="300"></div>
        <button class="x" data-del="${i}" aria-label="Quitar">✕</button></li>`).join("")}</ul>`
      : `<div class="empty">Todavía no hay nadie. Agrega mínimo 3 personas.</div>`}
      <div class="ok" id="counts"></div>
    </div>

    ${n?`<div class="card">
      <h2>📲 Link para todos</h2>
      <p class="hint" style="margin-top:0">Es el mismo link para todos. Cada quien elige quién es (ya no lo puede cambiar), escribe su regalo y, cuando actives las ruletas, ahí mismo gira la suya.</p>
      <div class="row" style="margin-top:10px">
        <a class="btn wa" id="gl-wa" target="_blank" rel="noopener" href="#">Mandar al grupo</a>
        <button class="btn ghost small" id="gl-copy">Copiar link</button>
      </div>
      <input class="linkbox" id="gl-box" readonly style="display:none">
    </div>`:""}

    <div class="card">
      <h2>🎰 Ruletas</h2>
      ${!drawn?`
        <p class="hint" style="margin-top:0">Actívalas cuando todos ya hayan puesto su regalo. Se arman las parejas por dentro (nadie se repite ni se toca a sí mismo) y cada quien gira su ruleta para ver a quién le tocó.</p>
        <button class="btn gold block" id="go" ${n<3?"disabled":""} style="margin-top:8px">🎰 Activar las ruletas ${n<3?`(faltan ${3-n})`:""}</button>`
      :`
        <div class="ok" style="margin-top:0" id="spuncount">✅ Ruletas activadas</div>
        ${changed?`<div class="confirm">Cambiaste participantes después de activar las ruletas. Usa <b>"Volver a armar las parejas"</b> abajo para que entren todos.</div>`:""}
        ${S.spoil?`<div class="spoiler">${dl.map(p=>`<div class="pair" style="flex-wrap:wrap">${esc(p.g)} <span class="arrow">→</span> ${esc(p.r)}<span class="pphone" style="width:100%;font-weight:600">🎁 ${esc(wishOf(p.r)||"Sin regalo todavía")}</span></div>`).join("")}</div>
          <button class="linkbtn" id="hide">Ocultar</button>`
        :`<button class="btn ghost block" id="spoil" style="margin-top:8px">👀 Ver quién le tocó a quién</button>`}
        <a class="btn wa block" style="margin-top:10px;padding:13px" target="_blank" rel="noopener" href="${waLink(S.orgPhone, `📋 ${S.title} — resultados:\n`+dl.map(p=>`• ${p.g} → ${p.r}${wishOf(p.r)?` (🎁 ${wishOf(p.r)})`:""}`).join("\n"))}">Mandarme la lista a mi WhatsApp</a>`}
    </div>

    <div class="card">
      <h2>⚙️ Reiniciar</h2>
      ${drawn?`<button class="btn ghost block" id="redraw">🔄 Volver a armar las parejas</button><p class="hint">Se queda quién es quién y sus regalos; solo cambia a quién le toca. Todos vuelven a girar.</p>`:""}
      <button class="btn ghost block" id="reset" style="margin-top:8px">♻️ Reiniciar todo el intercambio</button>
      <p class="hint">Borra quién eligió cada nombre, los regalos y las parejas. El link sigue siendo el mismo y todos vuelven a elegir quiénes son.</p>
      <div id="confirm-box"></div>
      <p class="hint" style="margin-top:14px">🔑 <a class="linkbtn" style="font-size:13px" target="_blank" rel="noopener" href="${waLink(S.orgPhone, `🔑 Mi link de organizador del ${S.title} (no lo compartas):\n${adminLink()}`)}">Mandarme mi link de organizador</a> — para abrir esta pantalla desde otro celular.</p>
    </div>
  `;
  // datos
  ["title","org","orgPhone","budget","date"].forEach(k=>$("#f-"+k).addEventListener("input",e=>{ S[k]=e.target.value; pushCfg(); refreshLinks(); }));
  const paintAddMe=()=>{ const w=$("#addme-wrap"); if(!w) return;
    w.innerHTML = S.org.trim() && !S.people.some(p=>keyOf(p.name)===keyOf(S.org)) ? `<button class="linkbtn" id="add-me">+ Agregarme a mí (${esc(S.org.trim())})</button>`:"";
    const me=$("#add-me"); if(me) me.onclick=()=>{ S.people.push({name:S.org.trim(),phone:S.orgPhone}); pushCfg(true); renderOrg(); }; };
  $("#f-org").addEventListener("input",paintAddMe); paintAddMe();
  // participantes
  const add=()=>{
    const name=$("#p-name").value.trim().replace(/\s+/g," "), phone=$("#p-phone").value.trim();
    if(!name){ $("#p-err").textContent="Escribe un nombre."; return; }
    if(S.people.some(p=>keyOf(p.name)===keyOf(name))){ $("#p-err").textContent="Ese nombre ya está. Ponle apellido o apodo."; return; }
    S.people.push({name,phone}); pushCfg(true); renderOrg(); $("#p-name").focus();
  };
  $("#p-add").onclick=add;
  $("#p-name").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#p-phone").focus(); }});
  $("#p-phone").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); }});
  $$("[data-del]").forEach(b=>b.onclick=()=>{ S.people.splice(+b.dataset.del,1); pushCfg(true); renderOrg(); });
  $$("[data-wish]").forEach(inp=>inp.addEventListener("input",()=>pushWish(S.people[+inp.dataset.wish].name, inp.value)));

  // link
  const gc=$("#gl-copy"); if(gc) gc.onclick=async()=>{ try{ await navigator.clipboard.writeText(groupLink()); gc.textContent="¡Copiado!"; }catch(e){ const b=$("#gl-box"); b.style.display="block"; b.value=groupLink(); b.select(); gc.textContent="Cópialo ↓"; } };
  refreshLinks();
  const ask=(msg,label,fn)=>{ $("#confirm-box").innerHTML=`<div class="confirm"><b>${msg}</b><div class="row" style="margin-top:10px"><button class="btn ghost small" id="no">Cancelar</button><button class="btn red small" id="yes">${label}</button></div></div>`;
    $("#no").onclick=()=>$("#confirm-box").innerHTML=""; $("#yes").onclick=fn; $("#confirm-box").scrollIntoView({block:"center"}); };
  // sorteo
  const go=$("#go"); if(go) go.onclick=()=>{
    const faltan=S.people.filter(p=>!wishOf(p.name)).map(p=>p.name);
    if(!faltan.length) return startDraw();
    ask(`Faltan ${faltan.length} por poner su regalo: ${faltan.map(esc).join(", ")}. Hasta que lo guarden no pueden girar su ruleta. ¿Activar las ruletas de todos modos?`,"Sí, activar",startDraw);
  };
  const sp=$("#spoil"); if(sp) sp.onclick=()=>{ S.spoil=true; save(); renderOrg(); };
  const hd=$("#hide"); if(hd) hd.onclick=()=>{ S.spoil=false; save(); renderOrg(); };
  // reiniciar
  const rd=$("#redraw"); if(rd) rd.onclick=()=>ask("¿Volver a armar las parejas? A todos les puede tocar otra persona y tienen que volver a girar.","Sí, repetir",async()=>{ await dbDel(`${S.ev}/spun`).catch(()=>{}); startDraw(); });
  $("#reset").onclick=()=>ask("¿Reiniciar todo? Se borran los nombres elegidos, los regalos y las parejas.","Sí, reiniciar",async()=>{
    try{ await Promise.all(["claims","wishes","spun","draw"].map(x=>dbDel(`${S.ev}/${x}`))); }catch(e){}
    LIVE={claims:{},wishes:{},spun:{},draw:null}; S.spoil=false; save(); renderOrg(); });
  paintStatus();
}
function refreshLinks(){
  const a=$("#gl-wa"); if(a) a.href=waLink("", `🎁 ¡Hola! Ya está el ${S.title}. Entra aquí, elige quién eres y escribe qué regalo quieres${S.budget.trim()?` (presupuesto: ${S.budget.trim()})`:""}. Cuando se activen las ruletas, en este mismo link giras la tuya para ver a quién le regalas 🎰\n${groupLink()}`);
}
function paintStatus(){
  const net=$("#net"); if(net) net.textContent = NET ? "" : "⚠️ Sin conexión a la base de datos. Revisa tu internet.";
  let cl=0,wi=0,sp=0;
  S.people.forEach((p,i)=>{
    const k=keyOf(p.name), c=!!LIVE.claims[k], w=!!wishOf(p.name), s=!!LIVE.spun[k]; cl+=c; wi+=w; sp+=s;
    const el=$("#st-"+i); if(el) el.innerHTML = `${c?`<span class="st on">🔒 Ya entró</span>`:`<span class="st">⏳ No ha entrado</span>`}${w?`<span class="st on">🎁 Regalo</span>`:""}${s?`<span class="st on">🎰 Ya giró</span>`:""}${c?`<button class="st free" data-free="${k}">Liberar</button>`:""}`;
    const inp=$(`[data-wish="${i}"]`); if(inp && inp!==document.activeElement && !wishT[p.name+"_typing"]) inp.value=wishOf(p.name);
  });
  const ct=$("#counts"); if(ct && S.people.length) ct.textContent=`${cl} de ${S.people.length} ya entraron · ${wi} ya pusieron su regalo`;
  const sc=$("#spuncount"); if(sc) sc.textContent=`✅ Ruletas activadas · ${sp} de ${drawList().length} ya giraron`;
}
async function refreshOrg(){ try{ await pull(); NET=true; }catch(e){ NET=false; } paintStatus(); }

async function startDraw(){
  const names=S.people.map(p=>p.name);
  $("#app").innerHTML=`<div class="tombola"><div class="spin"></div><div class="drum" id="drum"></div><p>Revolviendo papelitos…</p></div>`;
  const iv=setInterval(()=>{ $("#drum").textContent=names[Math.floor(Math.random()*names.length)]; },90);
  const d=doDraw(names), map={}; d.forEach(x=>map[keyOf(x.g)]=encode([x.g,x.r]));
  let ok=true;
  await Promise.all([ pushCfg(true), dbPut(`${S.ev}/draw`,map), dbDel(`${S.ev}/spun`), new Promise(r=>setTimeout(r,1900)) ]).catch(()=>{ ok=false; });
  clearInterval(iv);
  if(ok){ LIVE.draw=map; LIVE.spun={}; S.spoil=false; save(); confetti(); }
  renderOrg();
  if(!ok){ NET=false; paintStatus(); }
}

async function openAdmin(ev){
  $("#app").innerHTML=`<div class="tombola"><div class="spin"></div><p>Abriendo tu intercambio…</p></div>`;
  try{ const c=await dbGet(`${ev}/config`); if(c){ Object.assign(S,{ev,title:c.title||S.title,org:c.org||"",orgPhone:c.orgPhone||"",budget:c.budget||"",date:c.date||"",people:(c.people||[]).map(p=>({name:p.name,phone:p.phone||""}))}); save(); } }catch(e){}
  history.replaceState(null,"",location.pathname); startOrg();
}
async function startOrg(){ if(S.people.length) await pushCfg(true); await refreshOrg(); renderOrg(); clearInterval(window._oiv); window._oiv=setInterval(()=>{ if($("#counts")||$("#spuncount")) refreshOrg(); },12000); }

// ================== Participante (link único) ==================
let PIV=null;
function shell(inner){ $("#app").innerHTML=inner; }
function head(c,h1,sub){ return `<div class="stage"><span class="tag" style="color:var(--gold);font-weight:800;letter-spacing:.14em;font-size:12px;text-transform:uppercase">${esc(c.title||"Intercambio")}</span><h1>${h1}</h1>${sub?`<p style="opacity:.85;margin:0">${sub}</p>`:""}
  ${(c.budget||c.date)?`<div class="meta" style="margin-top:12px">${c.budget?`<span class="chip" style="color:var(--ink)">💰 Presupuesto: ${esc(c.budget)}</span>`:""}${c.date?`<span class="chip" style="color:var(--ink)">📅 ${esc(c.date)}</span>`:""}</div>`:""}</div>`; }

async function renderJoin(ev){
  clearInterval(PIV);
  shell(`<div class="tombola"><div class="spin"></div><p>Cargando…</p></div>`);
  let d; try{ d=await dbGet(ev); }catch(e){ shell(`<div class="stage"><h1>Sin conexión 📶</h1><div class="card" style="color:var(--ink)">No pude cargar el intercambio. Revisa tu internet.<br><br><button class="btn red block" onclick="route()">Intentar otra vez</button></div></div>`); return; }
  if(!d||!d.config||!(d.config.people||[]).length){ shell(`<div class="stage"><h1>Todavía no está listo 🎁</h1><div class="card" style="color:var(--ink)">El organizador todavía no agrega a los participantes. Intenta más tarde.</div></div>`); return; }
  const mine=lsGet("me-"+ev);
  if(mine){ const cl=(d.claims||{})[mine]; if(cl && cl.dev===DEV) return renderMe(ev,mine,d); lsDel("me-"+ev); }
  renderChoose(ev,d);
}

function renderChoose(ev,d){
  const c=d.config, claims=d.claims||{};
  shell(head(c,"¿Quién eres? 👀","Elige tu nombre. Ojo: ya no lo vas a poder cambiar.")+`
    <div class="card" style="margin-top:18px">
      <div class="namechips">${c.people.map((p,i)=>{ const t=!!claims[keyOf(p.name)]; return `<button class="namechip ${t?"taken":""}" data-n="${i}" ${t?"disabled":""}>${t?"🔒 ":""}${esc(p.name)}</button>`; }).join("")}</div>
      <p class="hint" style="text-align:center">Los nombres con 🔒 ya los eligió alguien.</p>
      <div id="cbox"></div>
    </div>`);
  $$("[data-n]").forEach(b=>b.onclick=()=>{
    const p=c.people[+b.dataset.n]; $$(".namechip").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    $("#cbox").innerHTML=`<div class="confirm" style="background:#fff;border-color:var(--gold)"><b>¿Seguro que eres ${esc(p.name)}?</b><br>Una vez que elijas, en este celular ya no podrás cambiarlo.<div class="row" style="margin-top:10px"><button class="btn ghost small" id="cno">No</button><button class="btn red small" id="cyes">Sí, soy ${esc(p.name)}</button></div><div class="err" id="cerr"></div></div>`;
    $("#cno").onclick=()=>{ $("#cbox").innerHTML=""; b.classList.remove("on"); };
    $("#cyes").onclick=async()=>{
      const k=keyOf(p.name), y=$("#cyes"); y.disabled=true; y.textContent="Un momento…";
      try{
        const cur=await dbGet(`${ev}/claims/${k}`);
        if(cur && cur.dev!==DEV){ $("#cerr").textContent=`Alguien ya eligió ese nombre. Si de verdad eres tú, pídele a ${c.org} que lo libere.`; y.disabled=false; y.textContent=`Sí, soy ${p.name}`; return; }
        await dbPut(`${ev}/claims/${k}`,{name:p.name,dev:DEV,t:Date.now()});
        lsSet("me-"+ev,k); renderJoin(ev);
      }catch(e){ $("#cerr").textContent="No se pudo guardar. Revisa tu internet."; y.disabled=false; y.textContent=`Sí, soy ${p.name}`; }
    };
    $("#cbox").scrollIntoView({block:"center",behavior:"smooth"});
  });
}

function renderMe(ev,k,d){
  const c=d.config, me=(c.people.find(p=>keyOf(p.name)===k)||(d.claims[k]||{})).name||"tú";
  const myWish=((d.wishes||{})[k]||{}).wish||"";
  const dr=d.draw||null, myDraw=dr&&dr[k]?decode(dr[k]):null, spun=!!(d.spun||{})[k];
  shell(head(c,`¡Hola, ${esc(me)}! 👋`,"")+`
    <div class="card" style="margin-top:18px" id="wcard">
      <h2>🎁 Tu regalo</h2>
      <div id="wview" style="${myWish?"":"display:none"}"><div class="giftwish" style="margin-top:0"><b>Pediste</b><div id="wtxt">${esc(myWish)}</div></div><button class="linkbtn" id="wedit">Cambiar mi regalo</button></div>
      <div id="wform" style="${myWish?"display:none":""}">
        <textarea id="w" maxlength="300" placeholder="Ej. Una sudadera talla M color negro, o unos audífonos">${esc(myWish)}</textarea>
        <p class="hint">${c.budget?`Pide algo de hasta <b>${esc(c.budget)}</b>. `:""}Puedes poner varias opciones, talla, color o tienda.</p>
        <button class="btn red block" id="wsave" style="margin-top:8px">Guardar mi regalo</button>
        <div class="err" id="werr"></div>
      </div>
    </div>
    <div class="card" id="rcard">
      <h2>🎰 Tu ruleta</h2>
      <div id="rbody"></div>
    </div>
    <p class="foot">Entraste como ${esc(me)}. Si no eres tú, pídele a ${esc(c.org)} que te libere.</p>`);
  $("#wedit").onclick=()=>{ $("#wview").style.display="none"; $("#wform").style.display=""; $("#w").focus(); };
  $("#wsave").onclick=async()=>{
    const w=$("#w").value.trim(), b=$("#wsave"); if(!w){ $("#werr").textContent="Escribe qué regalo quieres."; return; }
    b.disabled=true; b.textContent="Guardando…";
    try{ await dbPut(`${ev}/wishes/${k}`,{name:me,wish:w.slice(0,300),t:Date.now()}); $("#wtxt").textContent=w; $("#wform").style.display="none"; $("#wview").style.display=""; $("#werr").textContent=""; if(!myWish){ confetti(); if(dr) setTimeout(()=>renderJoin(ev),900); } }
    catch(e){ $("#werr").textContent="No se pudo guardar. Revisa tu internet."; }
    b.disabled=false; b.textContent="Guardar mi regalo";
  };
  const rb=$("#rbody");
  if(!dr){
    rb.innerHTML=`<p style="margin:0">${myWish?"✅ Ya guardaste tu regalo. ":"👆 Primero guarda qué regalo quieres. "}⏳ Todavía no se activan las ruletas. Cuando ${esc(c.org)} las active, aquí te va a salir la tuya.</p><p class="hint">Esta pantalla se actualiza sola.</p>`;
    PIV=setInterval(async()=>{ try{ const x=await dbGet(`${ev}/draw/${k}`); if(x){ clearInterval(PIV); renderJoin(ev); } const cl=await dbGet(`${ev}/claims/${k}`); if(!cl||cl.dev!==DEV){ clearInterval(PIV); lsDel("me-"+ev); renderJoin(ev); } }catch(e){} },15000);
    return;
  }
  if(myDraw && !myWish){ rb.innerHTML=`<p style="margin:0">👆 Primero guarda qué regalo quieres. Luego aquí te aparece tu ruleta.</p>`; return; }
  if(!myDraw){ rb.innerHTML=`<p style="margin:0">No estás en las ruletas. Avísale a ${esc(c.org)} para que lo repita.</p>`; return; }
  const r=myDraw[1];
  const result=()=>`
    <div class="lbl" style="text-align:center">Te tocó darle regalo a</div>
    <div class="who" style="text-align:center">${esc(r)}</div>
    <div class="giftwish"><b>🎁 Lo que quiere</b><div id="gw">${esc(((d.wishes||{})[keyOf(r)]||{}).wish||"Todavía no pone qué quiere. Vuelve a abrir este link más tarde 😉")}</div></div>
    <p class="secret" style="text-align:center">🤫 Es secreto, no le digas a nadie.</p>
    ${c.orgPhone?`<a class="btn wa block" style="padding:13px" target="_blank" rel="noopener" href="${waLink(c.orgPhone, `✅ Ya giré la ruleta del ${c.title} — ${me}`)}">Avisarle a ${esc(c.org)} que ya me tocó</a>`:""}`;
  if(spun){ rb.innerHTML=result(); return; }
  const names=c.people.map(p=>p.name).filter(n=>n!==me); if(!names.includes(r)) names.push(r);
  rb.innerHTML=`<div class="wheelwrap"><div class="pointer"></div><canvas id="wheel"></canvas><div class="hub">🎁</div></div>
    <button class="btn red block" id="spin" style="font-size:20px;padding:16px">🎰 ¡Pícale!</button>`;
  mountWheel(names, r, async()=>{ try{ await dbPut(`${ev}/spun/${k}`,Date.now()); }catch(e){}
    confetti(); rb.innerHTML=`<div class="reveal show">${result()}</div>`; $("#rcard").scrollIntoView({block:"start",behavior:"smooth"}); });
}

function mountWheel(names, r, onDone){
  for(let i=names.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [names[i],names[j]]=[names[j],names[i]]; }
  const target=names.indexOf(r);
  const cv=$("#wheel"), ctx=cv.getContext("2d"), dpr=Math.max(1,devicePixelRatio||1);
  const size=Math.min(300, innerWidth-72); cv.style.width=cv.style.height=size+"px"; cv.width=cv.height=size*dpr;
  const n=names.length, seg=2*Math.PI/n, R=size*dpr/2;
  const segCols=["#c8202f","#1f8a52","#e9b44c","#fff8ec","#2f6db5","#a3141f","#14523e","#c98f22"];
  function draw(rot){
    ctx.clearRect(0,0,cv.width,cv.height); ctx.save(); ctx.translate(R,R);
    for(let i=0;i<n;i++){
      const a0=rot+i*seg, col=segCols[(i+(n%segCols.length===1&&i===n-1?1:0))%segCols.length];
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-4*dpr,a0,a0+seg); ctx.closePath();
      ctx.fillStyle=col; ctx.fill(); ctx.strokeStyle="rgba(0,0,0,.18)"; ctx.lineWidth=2*dpr; ctx.stroke();
      ctx.save(); ctx.rotate(a0+seg/2); ctx.textAlign="right"; ctx.textBaseline="middle";
      ctx.fillStyle=(col==="#fff8ec"||col==="#e9b44c")?"#2a1d14":"#fff";
      const fs=Math.max(10, Math.min(18, 240/n))*dpr; ctx.font=`800 ${fs}px Nunito, sans-serif`;
      let t=names[i]; if(t.length>13) t=t.slice(0,12)+"…";
      ctx.fillText(t, R-14*dpr, 0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,R-3*dpr,0,2*Math.PI); ctx.lineWidth=6*dpr; ctx.strokeStyle="#e9b44c"; ctx.stroke();
    ctx.restore();
  }
  const jitter=(Math.random()-.5)*seg*.6, finalRot=-Math.PI/2-(target+.5)*seg+jitter;
  const norm=x=>((x%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  draw(Math.random()*2*Math.PI);
  $("#spin").onclick=()=>{
    const btn=$("#spin"); btn.disabled=true; btn.textContent="Girando…";
    const start=performance.now(), dur=5200, from=Math.random()*2*Math.PI, to=from+2*Math.PI*7+norm(finalRot-from);
    let last=-1;
    (function frame(now){
      const t=Math.min(1,(now-start)/dur), e=1-Math.pow(1-t,4), rot=from+(to-from)*e; draw(rot);
      const cur=Math.floor(norm(-Math.PI/2-rot)/seg); if(cur!==last){ last=cur; if(navigator.vibrate) try{navigator.vibrate(8)}catch(_){} }
      if(t<1) requestAnimationFrame(frame); else setTimeout(onDone,450);
    })(start);
  };
}

function renderBad(){ shell(`<div class="stage"><h1>Ups 🎁</h1><div class="card" style="color:var(--ink)">Este link no se pudo abrir. Pídele al organizador que te lo vuelva a mandar.</div></div>`); }

// ================== Confeti ==================
function confetti(){
  const c=$("#cf"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#c8202f","#e9b44c","#1f8a52","#fff8ec","#2f6db5"];
  const P=Array.from({length:160},()=>({x:c.width/2+(Math.random()-.5)*80,y:c.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0; (function step(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); x.restore(); }); if(++f<170) requestAnimationFrame(step); else x.clearRect(0,0,c.width,c.height); })();
}

document.addEventListener("click",e=>{ const b=e.target.closest("[data-free]"); if(!b) return; const k=b.dataset.free;
  b.textContent="Liberando…"; dbDel(`${S.ev}/claims/${k}`).then(()=>{ delete LIVE.claims[k]; paintStatus(); }).catch(()=>{ b.textContent="Error, intenta de nuevo"; }); });

// ================== Router ==================
function route(){
  const h=location.hash.replace(/^#/,"");
  if(!h) return startOrg();
  const d=decode(h);
  if(d && d[0]===4) return renderJoin(d[1]);
  if(d && d[0]===5) return openAdmin(d[1]);
  renderBad();
}
addEventListener("hashchange",route);
route();
</script>
